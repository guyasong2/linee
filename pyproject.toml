[project]
name = "linee"
version = "0.1.0"
description = "Queue management and appointment booking for essential services in Cameroon"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=23.1,<26",
    "celery[redis]>=5.5,<6",
    "channels>=4.2,<5",
    "channels-redis>=4.2,<5",
    "daphne>=4.1,<5",
    "django>=5.2,<5.3",
    "django-otp>=1.5,<2",
    "djangorestframework>=3.16,<4",
    "phonenumbers>=8.13,<9",
    "psycopg[binary]>=3.2,<4",
    "redis>=5.2,<7",
    "segno>=1.6,<2",
    "whitenoise>=6.9,<7",
]

[project.optional-dependencies]
dev = [
    "factory-boy>=3.3,<4",
    "freezegun>=1.5,<2",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "pytest-django>=4.9,<5",
    "ruff>=0.11,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "error::django.utils.deprecation.RemovedInDjango60Warning",
]

[tool.coverage.run]
source = ["apps", "config"]
omit = ["*/migrations/*", "*/apps.py", "*/admin.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if settings.DEBUG:",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["migrations", ".venv", "node_modules", "staticfiles"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"**/settings/*.py" = ["E402"]
